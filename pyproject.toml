[project]
name = "qwen3-asr-server"
version = "0.1.0"
description = "Qwen3-ASR speech recognition server (FastAPI) with ONNX Runtime and vLLM backends"
requires-python = ">=3.11,<3.14"
# Shared by every backend. A backend is picked with one of the extras below:
#   uv sync --extra cpu    ONNX Runtime on the CPU (Dockerfile.cpu)
#   uv sync --extra gpu    ONNX Runtime + CUDA 13 (Dockerfile.gpu)
#   uv sync --extra vllm   qwen-asr + vLLM on an NVIDIA GPU (Dockerfile)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
    "websockets>=14",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.5",
    "psutil>=6",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.20",
    "onnx>=1.17",
    "tokenizers>=0.20",
]
gpu = [
    # Pinned: 1.31.0 fails on the first prompt of the GQA decoder with "GQA flash attention workspace sizing
    # failed: Flash total sequence length must be positive and fit int32" (its new workspace check sees
    # total_sequence_length as 0). Check the decoder on a GPU before raising the pin.
    # CUDA/cuDNN come as nvidia-* wheels (loaded by onnxruntime.preload_dlls()); cuBLAS is not part of
    # onnxruntime-gpu's [cuda] extra, so it is listed explicitly.
    "onnxruntime-gpu[cuda,cudnn]==1.30.0; sys_platform == 'linux'",
    "nvidia-cublas; sys_platform == 'linux'",
    "onnx>=1.17",
    "tokenizers>=0.20",
]
vllm = [
    "qwen-asr[vllm]>=0.0.6; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
# Test and benchmark clients (client-streaming.py, benchmark.py) and the test suite
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false
default-groups = ["dev"]
# The backends install different builds of onnxruntime / torch, so only one extra can be active.
conflicts = [
    [{ extra = "cpu" }, { extra = "gpu" }, { extra = "vllm" }],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
